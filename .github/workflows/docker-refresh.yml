name: Refresh Docker Compose Stack

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/playbooks/docker-refresh.yml'
      - 'apps/**'
  workflow_dispatch:
jobs:
  refresh-docker-compose:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Create vault password file
        working-directory: ./ansible
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_pass.txt

      - name: Install Python Docker library
        run: pip install docker

      - name: Refresh Docker Compose stack on docker01
        working-directory: ./ansible
        run: ansible-playbook -i inventory.yml playbooks/docker-refresh.yml -v --vault-password-file vault_pass.txt